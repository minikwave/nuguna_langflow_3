[supervisord]
nodaemon=true

[program:flask]
command=flask run --host=0.0.0.0 --port=5000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/flask.log
stderr_logfile=/app/logs/flask_err.log

[program:langflow]
command=python -m langflow run --host=0.0.0.0 --port=7860
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/langflow.log
stderr_logfile=/app/logs/langflow_err.log
