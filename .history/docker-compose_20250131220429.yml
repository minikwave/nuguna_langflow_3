version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=src/app/main.py
      - FLASK_ENV=development
      - LANGFLOW_API_URL=http://langflow:7860
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
    depends_on:
      - langflow
      - redis

  langflow:
    image: logspace/langflow:latest
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_AUTO_LOGIN=false
    volumes:
      - langflow_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  langflow_data:
  redis_data:
