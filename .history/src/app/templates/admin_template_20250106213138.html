<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { margin: 10px 0; }
        .status div { margin-bottom: 5px; }
        .status span { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <div class="status">
        <h2>System Status:</h2>
        <div>Langflow Status: <span>{{ status.langflow_status }}</span></div>
        <div>Database 1 Status: <span>{{ status.database_1_status }}</span></div>
        <div>Database 2 Status: <span>{{ status.database_2_status }}</span></div>
    </div>
</body>
</html>
