[supervisord]
nodaemon=true

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
stderr_logfile=/var/log/fastapi.err.log
stdout_logfile=/var/log/fastapi.out.log

[program:langflow]
command=langflow run --host 0.0.0.0 --port 7860
autostart=true
autorestart=true
stderr_logfile=/var/log/langflow.err.log
stdout_logfile=/var/log/langflow.out.log

[program:streamlit]
command=streamlit run frontend/app.py --server.port 8501 --server.enableCORS false
autostart=true
autorestart=true
stderr_logfile=/var/log/streamlit.err.log
stdout_logfile=/var/log/streamlit.out.log
