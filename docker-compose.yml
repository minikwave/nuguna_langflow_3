version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:///./test.db"
    volumes:
      - .:/app
    command: ["bash", "-c", "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  prometheus:
    image: prom/prometheus
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
